name: ghost_container_manager
description: Apple container management tool for macOS.
publish_to: none
# 版本由人手动确定（docs/release-versioning.md）；发布入口拒绝 0.0.0。
version: 1.0.0

environment:
  sdk: 3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  container_bridge:
    path: packages/container_bridge
  maclauncher_sdk:
    git:
      url: https://github.com/Ghost233/MacLauncher.git
      ref: 268f88ef5ff47dbafe88200d5cddd090983ad313
      path: packages/maclauncher_sdk
  # MCP server SDK（task-15，issue #16；选型见 docs/research/dart-mcp-server-options.md）
  mcp_dart: ^2.4.3
  file_selector: ^1.1.0
  # 图表库（E12；本阶段只加依赖不画图）。锁定确切版本。
  fl_chart: 1.3.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
